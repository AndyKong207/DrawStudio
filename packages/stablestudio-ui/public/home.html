<!DOCTYPE html>
<html>
  <head>
    <title>般若绘画AI</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./draw-studio/favicon.svg" />
    
    <script src="https://draw-1304100014.cos.ap-shanghai.myqcloud.com/draw.js/tailwindcss.js"></script>
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" /> -->
    <script src="./draw-studio/countUp.js"></script>
  </head>
  <body class="bg-slate-100 h-full w-full overflow-y-auto">
    <div class="h-full w-full bg-slate-100 text-black">
      <div class="flex items-center space-x-2 p-4">
        <img class="w-9" src="./draw-studio/pineapple.png" alt="">
        <span class="text-lg font-bold">般若AI</span>
      </div>
      <div class="mx-auto flex max-w-[70rem] flex-col p-4">
        <!-- <span class="mb-10 mt-10 text-center text-4xl font-bold text-[#9013fe]">
          选择您要使用的功能
        </span> -->
        <div class="flex flex-wrap justify-around">
          <div class="mb-4 flex w-[500px] min-h-[310px] flex-col items-center rounded-lg bg-white p-8 shadow-md">
            <div class="mb-4 text-xl font-bold">AI绘画</div>
            <ul class="mb-4 space-y-3 flex-1 flex-col items-center list-disc">
              <li>强大的AI绘画功能</li>
              <li>文字生成图片/以图生图</li>
              <li>图片局部重绘/高清修复</li>
              <li>支持多种图像渲染风格</li>
            </ul>
            <button
              class="rounded px-4 py-2 text-base text-white bg-purple-500"
              onclick="handleToGenerate()"
            >
              免费使用
            </button>
          </div>
          <div class="mb-4 flex w-[500px] min-h-[310px] flex-col items-center rounded-lg bg-white p-8 shadow-md">
            <div class="mb-4 text-xl font-bold">语言AI大模型</div>
            <ul class="mb-4 space-y-3 flex-1 flex-col items-center list-disc">
              <li>撰写邮件/文案/合同/论文</li>
              <li>编写/解释/重构代码</li>
              <li>支持富文本格式，绘制图表</li>
              <li>支持所有语言的相互翻译</li>
            </ul>
            <button
              class="rounded px-4 py-2 text-base text-white bg-purple-500"
              onclick="handleToGPT()"
            >
              免费使用
            </button>
          </div>
        </div>
        <div class="my-6 flex flex-wrap justify-around text-3xl font-bold">
          <div class="flex min-w-[400px] shrink-0 flex-nowrap items-baseline justify-center space-x-2">
            <span class="text-2xl font-normal text-gray-500">
              已服务用户
            </span>
            <span id="users">0</span>
          </div>
          <div class="flex min-w-[400px] shrink-0 flex-nowrap items-baseline justify-center space-x-2">
            <span class="text-2xl font-normal text-gray-500">
              已处理文字
            </span>
            <span id="tokens">0</span>
          </div>
        </div>
      </div>
      <div>
        <img
          class="w-full"
          src="https://draw-1304100014.cos.ap-shanghai.myqcloud.com/banruoai%E4%B8%BB%E9%A1%B5.png"
          alt=""
        />
      </div>
      <div class="text-center py-2">
        <a class="text-xs text-gray-400" href="https://beian.miit.gov.cn/" target="_blank">苏ICP备2023011167号-9</a>
      </div>
    </div>
    <script>
      var sumData = {
        chats: 0,
        tokens: "",
      }
      var chats = new CountUp('users', 0, 9999);
      var tokens = new CountUp('tokens', 0, 9999);

      chats.start()
      tokens.start()

      fetchData()
      setInterval(fetchData, 5000);
      
      function fetchData () {
        fetch('/api/user/sum', {
          method: 'POST'
        }).then(function (resp) {
          return resp.json()
        }).then(function (data) {
          sumData = data 
          setNum()
        })
      };

      function setNum () {
        chats.update(sumData.chats)
        tokens.update(sumData.tokens)
      }

      function handleToGenerate () {
        window.open("/draw-studio/generate");
      };

      function handleToGPT () {
        window.open("/chat")
      };
    </script>
  </body>
</html>
