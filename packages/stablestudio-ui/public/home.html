<!DOCTYPE html>
<html lang="en">
  <head>
    <title>般若绘画AI</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <script src="tailwindcss.js"></script>
    <script src="./countUp.js"></script>
  </head>
  <body>
    <div class="h-screen w-screen overflow-y-auto bg-slate-100 text-black">
      <div class="flex items-center space-x-2 p-4">
        <img class="w-9" src="/draw-studio/pineapple.png" alt="">
        <span class="text-lg font-bold">般若AI</span>
      </div>
      <div class="mx-auto flex max-w-[70rem] flex-col p-4">
        <!-- <span class="mb-10 mt-10 text-center text-4xl font-bold text-[#9013fe]">
          选择您要使用的功能
        </span> -->
        <div class="flex flex-wrap justify-around">
          <div class="mb-4 flex w-[500px] min-h-[310px] flex-col items-center rounded-lg bg-white p-8 shadow-md">
            <div class="mb-4 text-xl font-bold">AI绘画</div>
            <ul class="mb-4 space-y-3 flex-1 flex-col items-center list-disc">
              <li>强大的AI绘画功能</li>
              <li>文字生成图片/以图生图</li>
              <li>图片局部重绘/高清修复</li>
              <li>支持多种图像渲染风格</li>
            </ul>
            <button
              class="rounded px-4 py-2 text-base text-white bg-purple-500"
              onclick="handleToGenerate()"
            >
              免费使用
            </button>
          </div>
          <div class="mb-4 flex w-[500px] min-h-[310px] flex-col items-center rounded-lg bg-white p-8 shadow-md">
            <div class="mb-4 text-xl font-bold">语言AI大模型</div>
            <ul class="mb-4 space-y-3 flex-1 flex-col items-center list-disc">
              <li>撰写邮件/文案/合同；编写/解释/重构代码</li>
              <li>修正语法，润色文字；概括论文，总结主题</li>
              <li>支持富文本格式，绘制图表（流程图/思维导图等）</li>
              <li>支持世界上几乎所有语言的相互翻译</li>
            </ul>
            <button
              class="rounded px-4 py-2 text-base text-white bg-purple-500"
              onclick="handleToGPT()"
            >
              免费使用
            </button>
          </div>
        </div>
        <div class="my-6 flex flex-wrap justify-around text-3xl font-bold">
          <div class="flex min-w-[400px] shrink-0 flex-nowrap items-baseline justify-center space-x-2">
            <span class="text-2xl font-normal text-gray-500">
              已服务用户
            </span>
            <span id="users">0</span>
          </div>
          <div class="flex min-w-[400px] shrink-0 flex-nowrap items-baseline justify-center space-x-2">
            <span class="text-2xl font-normal text-gray-500">
              已处理文字
            </span>
            <span id="tokens">0</span>
          </div>
        </div>
      </div>
      <div>
        <img
          class="w-full"
          src="https://draw-1304100014.cos.ap-shanghai.myqcloud.com/banruoai%E4%B8%BB%E9%A1%B5.png"
          alt=""
        />
      </div>
    </div>
    <script>
      let sumData = {
        users: 0,
        chats: 0,
        tokens: "",
      }
      const users = new CountUp('users', 0, 9999);
      const tokens = new CountUp('tokens', 0, 9999);

      users.start()
      tokens.start()

      window.onload = () => {
        fetchData()
        setInterval(() => {
          fetchData()
        }, 5000);
      }
      const fetchData = async () => {
        const resp = await fetch('/api/user/sum', {
          method: 'POST'
        })
        const data = await resp.json()
        sumData = data 
        setNum()
      };

      const setNum = () => {
        users.update(sumData.chats)
        tokens.update(sumData.tokens)
      }

      const handleToGenerate = () => {
        // navigate("/generate");
        window.location.href = "/draw-studio/generate";
      };

      const handleToGPT = () => {
        window.location.href = "https://124.222.198.28";
      };
    </script>
  </body>
</html>
